name: Build IPA & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build IPA and create release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --version

      - name: Generate Xcode project
        run: |
          xtool dev generate-xcode-project

      - name: Build app (device)
        run: |
          xtool dev build

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R xtool/slopWidget.app Payload/
          zip -r slopWidget.ipa Payload
          ls -la slopWidget.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: slopWidget.ipa
          generate_release_notes: true
